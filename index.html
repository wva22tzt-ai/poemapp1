<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>뭘 살까? 랜덤 뽑기</title>
<meta name="description" content="중국어 회화 수업용 랜덤 뽑기: 물건, 색깔, 크기">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&family=Noto+Sans+SC:wght@500;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f6;--fg:#14213d;--card:#ffffff;--muted:#53607a;--line:#d3dbe6;--accent:#1d4ed8;--accent-fg:#ffffff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1520;--fg:#eef1f6;--card:#192234;--muted:#a3afc5;--line:#2c3850;--accent:#7aa2ff;--accent-fg:#0f1520}}
:root[data-theme="dark"]{--bg:#0f1520;--fg:#eef1f6;--card:#192234;--muted:#a3afc5;--line:#2c3850;--accent:#7aa2ff;--accent-fg:#0f1520}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Noto Sans KR','Noto Sans SC',sans-serif;line-height:1.5}
main{max-width:980px;margin:0 auto;padding:28px 20px 48px}
h1{font-size:28px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 24px;font-size:17px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:640px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:6px;min-height:250px}
.label{font-size:17px;color:var(--muted);font-weight:700}
.zh{font-family:'Noto Sans SC','Noto Sans KR',sans-serif;font-weight:900;font-size:76px;line-height:1.15}
.py,.ko{font-size:24px}
.py{color:var(--muted)}
.pic{width:120px;height:120px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:72px;line-height:1;align-self:flex-start;transition:background .15s}
.swatch{height:96px;border-radius:12px;border:2px solid var(--line);margin-bottom:8px;transition:background .15s}
.hide .py,.hide .ko{visibility:hidden}
.size{margin-top:16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.size .zh{font-size:44px}
.sent{margin-top:16px;border-radius:20px;background:var(--card);border:2px solid var(--line);padding:22px 24px}
.sent .zh{font-size:40px}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}
button{font:inherit;font-weight:700;font-size:22px;border-radius:14px;padding:14px 28px;border:2px solid var(--accent);cursor:pointer}
button:focus-visible{outline:3px solid var(--fg);outline-offset:3px}
.go{background:var(--accent);color:var(--accent-fg)}
.alt{background:transparent;color:var(--fg);border-color:var(--line);font-size:18px}
.alt[aria-pressed="true"]{border-color:var(--accent)}
.script{display:none;margin-top:16px;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:20px 24px}
.script.on{display:block}
.script p{margin:6px 0;font-size:24px}
.script b{color:var(--accent)}
</style>
</head>
<body>
<main>
<h1>뭘 살까? 랜덤 뽑기</h1>
<p class="sub">뽑기를 누르면 살 물건, 색깔, 크기가 정해져요. 그 단어로 짝과 대화를 이어 가세요.</p>
<div class="grid" id="cards">
  <div class="card"><span class="label">살 물건</span><div class="pic" id="pic" role="img" aria-label="살 물건 그림"></div><div class="zh" id="itemZh">鞋</div><div class="py" id="itemPy">xié</div><div class="ko" id="itemKo">신발</div></div>
  <div class="card"><span class="label">색깔</span><div class="swatch" id="sw"></div><div class="zh" id="colZh">白色</div><div class="py" id="colPy">báisè</div><div class="ko" id="colKo">흰색</div></div>
</div>
<div class="card size" style="min-height:0;flex-direction:row" id="sizeCard"><span class="label">요청할 크기</span><span class="zh" id="szZh">大</span><span class="py" id="szPy">dà</span><span class="ko" id="szKo">큰 것</span></div>
<div class="sent"><span class="label">이 단어로 첫 문장 만들기</span><div class="zh" id="s1">我要买一双白色的鞋。</div></div>
<div class="row">
  <button class="go" id="draw">뽑기</button>
  <button class="alt" id="hideBtn" aria-pressed="false">병음·뜻 숨기기</button>
  <button class="alt" id="scriptBtn" aria-pressed="false">본문 대화 보기</button>
</div>
<div class="script" id="script" aria-live="polite">
  <p><b>태양</b> 我要买一双鞋。</p>
  <p><b>점원</b> 这双白色的怎么样？</p>
  <p><b>태양</b> 还行。有没有大一点儿的？</p>
  <p><b>점원</b> 有，请等一下。</p>
</div>
</main>
<script>
var items=[
{zh:"鞋",py:"xié",ko:"신발",m:"双"},
{zh:"袜子",py:"wàzi",ko:"양말",m:"双"},
{zh:"衣服",py:"yīfu",ko:"옷",m:"件"},
{zh:"裤子",py:"kùzi",ko:"바지",m:"条"},
{zh:"帽子",py:"màozi",ko:"모자",m:"顶"},
{zh:"书包",py:"shūbāo",ko:"가방",m:"个"}];
var colors=[
{zh:"白色",py:"báisè",ko:"흰색",hex:"#ffffff"},
{zh:"黑色",py:"hēisè",ko:"검은색",hex:"#1a1a1a"},
{zh:"红色",py:"hóngsè",ko:"빨간색",hex:"#d62828"},
{zh:"蓝色",py:"lánsè",ko:"파란색",hex:"#2563eb"},
{zh:"黄色",py:"huángsè",ko:"노란색",hex:"#f5c518"},
{zh:"绿色",py:"lǜsè",ko:"초록색",hex:"#2f9e44"},
{zh:"粉色",py:"fěnsè",ko:"분홍색",hex:"#f783ac"},
{zh:"灰色",py:"huīsè",ko:"회색",hex:"#868e96"}];
var sizes=[{zh:"大",py:"dà",ko:"큰 것"},{zh:"小",py:"xiǎo",ko:"작은 것"}];
var emo={"鞋":"👟","袜子":"🧦","衣服":"👕","裤子":"👖","帽子":"🧢","书包":"🎒"};
function drawPic(zh,hex){
  var p=$("pic");
  p.textContent=emo[zh]||"";
  p.style.background=hex;
}
function $(id){return document.getElementById(id)}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function show(it,co,sz){
  $("itemZh").textContent=it.zh;$("itemPy").textContent=it.py;$("itemKo").textContent=it.ko;
  $("colZh").textContent=co.zh;$("colPy").textContent=co.py;$("colKo").textContent=co.ko;
  $("sw").style.background=co.hex;
  drawPic(it.zh,co.hex);
  $("szZh").textContent=sz.zh;$("szPy").textContent=sz.py;$("szKo").textContent=sz.ko;
  $("s1").textContent="我要买一"+it.m+co.zh+"的"+it.zh+"。";
  $("script").innerHTML="<p><b>태양</b> 我要买一"+it.m+it.zh+"。</p><p><b>점원</b> 这"+it.m+co.zh+"的怎么样？</p><p><b>태양</b> 还行。有没有"+sz.zh+"一点儿的？</p><p><b>점원</b> 有，请等一下。</p>";
}
var busy=false;
function draw(){
  if(busy)return;busy=true;
  var final=[pick(items),pick(colors),pick(sizes)];
  var reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(reduce){show(final[0],final[1],final[2]);busy=false;return}
  var n=0,t=setInterval(function(){
    n++;
    if(n>=12){clearInterval(t);show(final[0],final[1],final[2]);busy=false}
    else show(pick(items),pick(colors),pick(sizes));
  },75);
}
$("draw").onclick=draw;
$("hideBtn").onclick=function(){
  var on=this.getAttribute("aria-pressed")!=="true";
  this.setAttribute("aria-pressed",on);
  document.body.classList.toggle("hide",on);
  this.textContent=on?"병음·뜻 보이기":"병음·뜻 숨기기";
};
$("scriptBtn").onclick=function(){
  var on=this.getAttribute("aria-pressed")!=="true";
  this.setAttribute("aria-pressed",on);
  $("script").classList.toggle("on",on);
  this.textContent=on?"본문 대화 숨기기":"본문 대화 보기";
};
show(items[0],colors[0],sizes[0]);
</script>
</body>
</html>
